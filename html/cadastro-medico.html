<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Rai Soares">
    <meta name="description" content="Cadastro de um novo médico no Sistema Hospitalar.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro do médico | Sistema Hospitalar</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/cadastro-medico.css">
</head>
<body data-acesso="publico">
    <header>
        <h1>Sistema Hospitalar</h1>
        <nav>
            <a href="../index.html">Login</a>
            <a href="cadastro-medico.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Cadastro do médico</h2>
            <p>Crie seu acesso para gerenciar seus pacientes e prontuários.</p>

            <form id="form-cadastro" method="post">
                <fieldset>
                    <legend>Dados do médico</legend>

                    <div class="campo">
                        <label for="nome">Nome completo:</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" autocomplete="name" required>
                    </div>

                    <div class="campo">
                        <label for="crm">CRM:</label>
                        <input type="text" id="crm" name="crm" placeholder="123456/SP" maxlength="10" required>
                    </div>

                    <div class="campo">
                        <label for="especialidade">Especialidade:</label>
                        <input list="especialidades" id="especialidade" name="especialidade" placeholder="Digite ou escolha uma especialidade" required>
                        <datalist id="especialidades">
                            <option value="Clínica geral">
                            <option value="Cardiologia">
                            <option value="Dermatologia">
                            <option value="Endocrinologia">
                            <option value="Ginecologia">
                            <option value="Neurologia">
                            <option value="Ortopedia">
                            <option value="Pediatria">
                            <option value="Psiquiatria">
                        </datalist>
                    </div>

                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="medico@exemplo.com" autocomplete="username" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" placeholder="Mínimo de 6 caracteres" autocomplete="new-password" minlength="6" required>
                    </div>

                    <div class="campo">
                        <label for="confirmacao">Confirmar senha:</label>
                        <input type="password" id="confirmacao" name="confirmacao" placeholder="Repita a senha" autocomplete="new-password" minlength="6" required>
                    </div>

                    <div class="botoes">
                        <input type="submit" value="Cadastrar">
                    </div>
                </fieldset>
            </form>
        </section>

        <aside>
            <p>Já tem cadastro? <a href="../index.html">Entre no sistema</a>.</p>
        </aside>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Sistema Hospitalar &middot; Dados demonstrativos</p>
    </footer>

    <script src="../js/storage.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/cadastro-medico.js"></script>
</body>
</html>
