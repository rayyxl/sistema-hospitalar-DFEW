<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Rai Soares">
    <meta name="description" content="Tela de acesso ao Sistema Hospitalar, destinada ao médico.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="images/icone.svg">
    <link rel="apple-touch-icon" href="images/icone-180.png">
    <title>Login | Sistema Hospitalar</title>
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body data-acesso="publico">
    <header>
        <h1><img src="./images/icone.svg" alt="" width="32" height="32"> Sistema Hospitalar</h1>
        <nav>
            <a href="index.html">Login</a>
            <a href="html/cadastro-medico.html">Cadastro</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Acesso do médico</h2>
            <p>Informe suas credenciais para acessar o sistema.</p>

            <form id="form-login" method="post">
                <fieldset>
                    <legend>Login</legend>

                    <div class="campo">
                        <label for="email">E-mail:</label>
                        <input type="email" id="email" name="email" placeholder="medico@exemplo.com" autocomplete="username" required>
                    </div>

                    <div class="campo">
                        <label for="senha">Senha:</label>
                        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                    </div>

                    <div class="botoes">
                        <input type="submit" value="Entrar">
                    </div>
                </fieldset>
            </form>
        </section>

        <aside>
            <p>Ainda não tem acesso? <a href="html/cadastro-medico.html">Cadastre-se como médico</a>.</p>
        </aside>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Sistema Hospitalar &middot; Rai Soares</p>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/global.js"></script>
    <script src="js/login.js"></script>
</body>
</html>
