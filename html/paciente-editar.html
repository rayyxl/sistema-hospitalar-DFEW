<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Rai Soares">
    <meta name="description" content="Formulário de edição dos dados de um paciente no Sistema Hospitalar.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../images/icone.svg">
    <link rel="apple-touch-icon" href="../images/icone-180.png">
    <title>Editar paciente | Sistema Hospitalar</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/paciente-editar.css">
</head>
<body data-acesso="restrito">
    <header>
        <h1><img src="../images/icone.svg" alt="" width="32" height="32"> Sistema Hospitalar</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="pacientes.html">Pacientes</a>
            <a href="../index.html" data-sair>Sair</a>
        </nav>
    </header>

    <main>
        <h2>Editar paciente</h2>
        <p>Editando os dados de: <strong id="nome-paciente"></strong></p>

        <form id="form-paciente" data-modo="editar">
            <fieldset>
                <legend>Dados pessoais</legend>

                <div class="campo">
                    <label for="nome">Nome completo:</label>
                    <input type="text" id="nome" name="nome" required>
                </div>

                <div class="campo">
                    <label for="cpf">CPF:</label>
                    <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" data-mascara="cpf" maxlength="14" inputmode="numeric" required>
                </div>

                <div class="campo">
                    <label for="nascimento">Data de nascimento:</label>
                    <input type="date" id="nascimento" name="nascimento" required>
                </div>

                <div class="campo">
                    <span class="rotulo">Sexo:</span>
                    <div class="opcoes">
                        <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
                        <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
                        <label><input type="radio" name="sexo" value="outro"> Outro</label>
                    </div>
                </div>

                <div class="campo">
                    <label for="sangue">Tipo sanguíneo:</label>
                    <select id="sangue" name="sangue">
                        <option value="">Selecione</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                    </select>
                </div>
            </fieldset>

            <fieldset>
                <legend>Contato</legend>

                <div class="campo">
                    <label for="email">E-mail:</label>
                    <input type="email" id="email" name="email">
                </div>

                <div class="campo">
                    <label for="telefone">Telefone:</label>
                    <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" data-mascara="telefone" maxlength="15" inputmode="tel" required>
                </div>

                <div class="campo">
                    <label for="endereco">Endereço:</label>
                    <textarea id="endereco" name="endereco" rows="3" cols="40"></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Informações clínicas iniciais</legend>

                <div class="campo">
                    <label for="alergias">Alergias conhecidas:</label>
                    <textarea id="alergias" name="alergias" rows="3" cols="40"></textarea>
                </div>

                <div class="campo">
                    <label for="observacoes">Observações gerais:</label>
                    <textarea id="observacoes" name="observacoes" rows="3" cols="40"></textarea>
                </div>
            </fieldset>

            <div class="botoes">
                <input type="submit" value="Salvar alterações">
                <a href="pacientes.html" id="link-cancelar">Cancelar</a>
            </div>
        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Sistema Hospitalar &middot; Dados demonstrativos</p>
    </footer>

    <script src="../js/storage.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/paciente-form.js"></script>
</body>
</html>
