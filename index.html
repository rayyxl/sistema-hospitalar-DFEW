<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Rai Soares">
    <meta name="description" content="Tela de acesso ao Sistema Hospitalar, destinada ao médico.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/login.css">
    <title>Login | Sistema Hospitalar</title>
</head>
<body>
    <header>
        <h1>Sistema Hospitalar</h1>
        <nav>
            <a href="index.html">Login</a> |
            <a href="html/dashboard.html">Dashboard</a> |
            <a href="html/pacientes.html">Pacientes</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Acesso do médico</h2>
            <p>Informe suas credenciais para acessar o sistema.</p>

            <form>
                <fieldset>
                    <legend>Login</legend>

                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" placeholder="medico@exemplo.com" required><br><br>

                    <label for="senha">Senha:</label><br>
                    <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required><br><br>

                    <input type="submit" value="Entrar">
                </fieldset>
            </form>
        </section>

        <aside>
            <p>Dados demonstrativos: qualquer e-mail e senha permitem a entrada nesta etapa.</p>
        </aside>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Sistema Hospitalar &middot; Rai Soares</p>
    </footer>
</body>
</html>
