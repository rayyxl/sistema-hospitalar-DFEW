<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Rai Soares">
    <meta name="description" content="Formulário de cadastro de novo paciente no Sistema Hospitalar.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo paciente | Sistema Hospitalar</title>
</head>
<body>
    <header>
        <h1>Sistema Hospitalar</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a> |
            <a href="pacientes.html">Pacientes</a> |
            <a href="../index.html">Sair</a>
        </nav>
    </header>

    <main>
        <h2>Cadastrar novo paciente</h2>

        <form>
            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label><br>
                <input type="text" id="nome" name="nome" placeholder="Digite o nome completo" required><br><br>

                <label for="cpf">CPF:</label><br>
                <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" required><br><br>

                <label for="nascimento">Data de nascimento:</label><br>
                <input type="date" id="nascimento" name="nascimento" required><br><br>

                Sexo:<br>
                <label><input type="radio" name="sexo" value="feminino"> Feminino</label>
                <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
                <label><input type="radio" name="sexo" value="outro"> Outro</label><br><br>

                <label for="sangue">Tipo sanguíneo:</label><br>
                <select id="sangue" name="sangue">
                    <option value="">Selecione</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Contato</legend>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" placeholder="paciente@exemplo.com"><br><br>

                <label for="telefone">Telefone:</label><br>
                <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" required><br><br>

                <label for="endereco">Endereço:</label><br>
                <textarea id="endereco" name="endereco" rows="3" cols="40" placeholder="Rua, número, bairro, cidade"></textarea>
            </fieldset>

            <fieldset>
                <legend>Informações clínicas iniciais</legend>

                <label for="alergias">Alergias conhecidas:</label><br>
                <textarea id="alergias" name="alergias" rows="3" cols="40" placeholder="Descreva, se houver"></textarea>
            </fieldset>

            <br>
            <input type="submit" value="Salvar paciente">
            <input type="reset" value="Limpar">
            <a href="pacientes.html">Cancelar</a>
        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Sistema Hospitalar &middot; Dados demonstrativos</p>
    </footer>
</body>
</html>
