<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Rai Soares">
    <meta name="description" content="Formulário de edição dos dados de um paciente no Sistema Hospitalar.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar paciente | Sistema Hospitalar</title>
</head>
<body>
    <header>
        <h1>Sistema Hospitalar</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a> |
            <a href="pacientes.html">Pacientes</a> |
            <a href="../index.html">Sair</a>
        </nav>
    </header>

    <main>
        <h2>Editar paciente</h2>
        <p>Editando os dados de: <strong>Maria Souza</strong></p>

        <form>
            <fieldset>
                <legend>Dados pessoais</legend>

                <label for="nome">Nome completo:</label><br>
                <input type="text" id="nome" name="nome" value="Maria Souza" required><br><br>

                <label for="cpf">CPF:</label><br>
                <input type="text" id="cpf" name="cpf" value="123.456.789-00" required><br><br>

                <label for="nascimento">Data de nascimento:</label><br>
                <input type="date" id="nascimento" name="nascimento" value="1978-05-12" required><br><br>

                Sexo:<br>
                <label><input type="radio" name="sexo" value="feminino" checked> Feminino</label>
                <label><input type="radio" name="sexo" value="masculino"> Masculino</label>
                <label><input type="radio" name="sexo" value="outro"> Outro</label><br><br>

                <label for="sangue">Tipo sanguíneo:</label><br>
                <select id="sangue" name="sangue">
                    <option value="">Selecione</option>
                    <option value="A+" selected>A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>
                </select>
            </fieldset>

            <fieldset>
                <legend>Contato</legend>

                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" value="maria.souza@exemplo.com"><br><br>

                <label for="telefone">Telefone:</label><br>
                <input type="text" id="telefone" name="telefone" value="(11) 91234-5678" required><br><br>

                <label for="endereco">Endereço:</label><br>
                <textarea id="endereco" name="endereco" rows="3" cols="40">Rua das Flores, 123, Centro, Guarulhos - SP</textarea>
            </fieldset>

            <fieldset>
                <legend>Informações clínicas iniciais</legend>

                <label for="alergias">Alergias conhecidas:</label><br>
                <textarea id="alergias" name="alergias" rows="3" cols="40">Alergia a dipirona.</textarea>
            </fieldset>

            <br>
            <input type="submit" value="Salvar alterações">
            <a href="pacientes.html">Cancelar</a>
        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Sistema Hospitalar &middot; Dados demonstrativos</p>
    </footer>
</body>
</html>
