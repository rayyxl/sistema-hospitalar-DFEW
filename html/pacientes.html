<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Rai Soares">
    <meta name="description" content="Lista de pacientes cadastrados no Sistema Hospitalar.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../images/icone.svg">
    <link rel="apple-touch-icon" href="../images/icone-180.png">
    <title>Pacientes | Sistema Hospitalar</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/pacientes.css">
</head>
<body data-acesso="restrito">
    <header>
        <h1><img src="../images/icone.svg" alt="" width="32" height="32"> Sistema Hospitalar</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="pacientes.html">Pacientes</a>
            <a href="../index.html" data-sair>Sair</a>
        </nav>
    </header>

    <main>
        <h2>Pacientes</h2>

        <section>
            <h3>Buscar paciente</h3>
            <form id="form-busca" action="pacientes.html" method="get">
                <div class="campo">
                    <label for="busca">Nome ou CPF:</label>
                    <input type="text" id="busca" name="busca" placeholder="Digite para buscar" autocomplete="off">
                </div>
                <div class="botoes">
                    <input type="submit" value="Buscar">
                </div>
            </form>
        </section>

        <section>
            <h3>Pacientes cadastrados</h3>
            <p class="acao-principal"><a href="paciente-novo.html">+ Cadastrar novo paciente</a></p>

            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>CPF</th>
                        <th>Nascimento</th>
                        <th>Telefone</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="lista-pacientes"></tbody>
            </table>
        </section>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Sistema Hospitalar &middot; Dados demonstrativos</p>
    </footer>

    <script src="../js/storage.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/pacientes.js"></script>
</body>
</html>
