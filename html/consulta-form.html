<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Rai Soares">
    <meta name="description" content="Formulário para adicionar ou editar uma consulta no prontuário do paciente.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../images/icone.svg">
    <link rel="apple-touch-icon" href="../images/icone-180.png">
    <title>Formulário de consulta | Sistema Hospitalar</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/consulta-form.css">
</head>
<body data-acesso="restrito">
    <header>
        <h1><img src="../images/icone.svg" alt="" width="32" height="32"> Sistema Hospitalar</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="pacientes.html">Pacientes</a>
            <a href="../index.html" data-sair>Sair</a>
        </nav>
    </header>

    <main>
        <h2 id="titulo-form">Adicionar consulta</h2>
        <p class="voltar"><a href="consultas.html" id="link-voltar">&larr; Voltar às consultas</a></p>

        <form id="form-consulta">
            <fieldset id="campos">
                <legend>Dados da consulta</legend>

                <div class="campo">
                    <label for="paciente">Paciente:</label>
                    <select id="paciente" name="paciente" required></select>
                </div>

                <div class="campo">
                    <label for="data">Data:</label>
                    <input type="date" id="data" name="data" required>
                </div>

                <div class="campo">
                    <label for="horario">Horário:</label>
                    <input type="time" id="horario" name="horario" required>
                </div>

                <div class="campo">
                    <label for="motivo">Motivo da consulta:</label>
                    <input type="text" id="motivo" name="motivo" placeholder="Ex.: retorno, dor, check-up" required>
                </div>

                <div class="campo">
                    <label for="diagnostico">Diagnóstico:</label>
                    <textarea id="diagnostico" name="diagnostico" rows="4" cols="40" placeholder="Descreva o diagnóstico"></textarea>
                </div>

                <div class="campo">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes" name="observacoes" rows="4" cols="40" placeholder="Condutas, prescrições e orientações"></textarea>
                </div>
            </fieldset>

            <div class="botoes">
                <input type="submit" value="Salvar consulta" id="botao-salvar">
                <input type="reset" value="Limpar">
                <a href="consultas.html" id="link-cancelar">Cancelar</a>
            </div>
        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Sistema Hospitalar &middot; Dados demonstrativos</p>
    </footer>

    <script src="../js/storage.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/consulta-form.js"></script>
</body>
</html>
