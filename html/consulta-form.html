<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Rai Soares">
    <meta name="description" content="Formulário para adicionar ou editar uma consulta no prontuário do paciente.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário de consulta | Sistema Hospitalar</title>
</head>
<body>
    <header>
        <h1>Sistema Hospitalar</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a> |
            <a href="pacientes.html">Pacientes</a> |
            <a href="../index.html">Sair</a>
        </nav>
    </header>

    <main>
        <h2>Adicionar / editar consulta</h2>
        <p><a href="consultas.html">&larr; Voltar às consultas</a></p>

        <form>
            <fieldset>
                <legend>Dados da consulta</legend>

                <label for="paciente">Paciente:</label><br>
                <select id="paciente" name="paciente" required>
                    <option value="maria" selected>Maria Souza</option>
                    <option value="joao">João Pereira</option>
                    <option value="ana">Ana Lima</option>
                </select><br><br>

                <label for="data">Data:</label><br>
                <input type="date" id="data" name="data" required><br><br>

                <label for="horario">Horário:</label><br>
                <input type="time" id="horario" name="horario" required><br><br>

                <label for="motivo">Motivo da consulta:</label><br>
                <input type="text" id="motivo" name="motivo" placeholder="Ex.: retorno, dor, check-up" required><br><br>

                <label for="diagnostico">Diagnóstico:</label><br>
                <textarea id="diagnostico" name="diagnostico" rows="4" cols="40" placeholder="Descreva o diagnóstico"></textarea><br><br>

                <label for="observacoes">Observações:</label><br>
                <textarea id="observacoes" name="observacoes" rows="4" cols="40" placeholder="Condutas, prescrições e orientações"></textarea>
            </fieldset>

            <br>
            <input type="submit" value="Salvar consulta">
            <input type="reset" value="Limpar">
            <a href="consultas.html">Cancelar</a>
        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Sistema Hospitalar &middot; Dados demonstrativos</p>
    </footer>
</body>
</html>
