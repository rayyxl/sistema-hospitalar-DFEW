<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Rai Soares">
    <meta name="description" content="Formulário para adicionar ou editar um exame no prontuário do paciente.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="../images/icone.svg">
    <link rel="apple-touch-icon" href="../images/icone-180.png">
    <title>Formulário de exame | Sistema Hospitalar</title>
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/exame-form.css">
</head>
<body data-acesso="restrito">
    <header>
        <h1><img src="../images/icone.svg" alt="" width="32" height="32"> Sistema Hospitalar</h1>
        <nav>
            <a href="dashboard.html">Dashboard</a>
            <a href="pacientes.html">Pacientes</a>
            <a href="../index.html" data-sair>Sair</a>
        </nav>
    </header>

    <main>
        <h2 id="titulo-form">Adicionar exame</h2>
        <p class="voltar"><a href="exames.html" id="link-voltar">&larr; Voltar aos exames</a></p>

        <form id="form-exame">
            <fieldset id="campos">
                <legend>Dados do exame</legend>

                <div class="campo">
                    <label for="paciente">Paciente:</label>
                    <select id="paciente" name="paciente" required></select>
                </div>

                <div class="campo">
                    <label for="tipo">Tipo de exame:</label>
                    <input list="tipos-exame" id="tipo" name="tipo" placeholder="Digite ou escolha um exame" required>
                    <datalist id="tipos-exame">
                        <option value="Hemograma completo">
                        <option value="Eletrocardiograma">
                        <option value="Glicemia em jejum">
                        <option value="Raio-X">
                        <option value="Ressonância magnética">
                        <option value="Ultrassonografia">
                    </datalist>
                </div>

                <div class="campo">
                    <label for="data">Data de realização:</label>
                    <input type="date" id="data" name="data" required>
                </div>

                <div class="campo">
                    <label for="resultado">Resultado:</label>
                    <textarea id="resultado" name="resultado" rows="4" cols="40" placeholder="Descreva o resultado do exame" required></textarea>
                </div>

                <div class="campo">
                    <label for="arquivo">Arquivo do laudo:</label>
                    <input type="file" id="arquivo" name="arquivo">
                    <small class="dica" id="arquivo-atual">O navegador não comporta arquivos no localStorage: apenas o nome do arquivo escolhido é registrado.</small>
                </div>

                <div class="campo">
                    <label for="observacoes">Observações:</label>
                    <textarea id="observacoes" name="observacoes" rows="4" cols="40" placeholder="Informações adicionais"></textarea>
                </div>
            </fieldset>

            <div class="botoes">
                <input type="submit" value="Salvar exame" id="botao-salvar">
                <input type="reset" value="Limpar">
                <a href="exames.html" id="link-cancelar">Cancelar</a>
            </div>
        </form>
    </main>

    <footer>
        <hr>
        <p>&copy; 2026 Sistema Hospitalar &middot; Dados demonstrativos</p>
    </footer>

    <script src="../js/storage.js"></script>
    <script src="../js/global.js"></script>
    <script src="../js/exame-form.js"></script>
</body>
</html>
